  <text x="342" y="427" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">A010001</text>
  <text x="500" y="427" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">카드</text>
  <text x="716" y="427" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">1</text>
  <text x="838" y="427" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">mig_a010001_s3</text>
  <text x="1080" y="427" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">mig_a010001_ins</text>
  <line x1="320" y1="480" x2="1380" y2="480" stroke="#e4eaf0"/>
  <text x="342" y="469" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">A010002</text>
  <text x="500" y="469" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">고객</text>
  <text x="716" y="469" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">1</text>
  <text x="838" y="469" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">mig_a010002_s3</text>
  <text x="1080" y="469" fill="#344b62" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">mig_a010002_ins</text>
  <text x="344" y="526" fill="#65788c" font-family="Malgun Gothic, Arial, sans-serif" font-size="13">표의 값은 예시입니다. 실제 등록된 주제영역과 DAG명이 표시됩니다.</text>
  <rect x="288" y="622" width="540" height="326" rx="12" fill="#ffffff" stroke="#d8e1ec"/>
  <text x="320" y="664" fill="#112d4e" font-family="Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="700">🧰 스냅샷 복구</text>
  <rect x="320" y="690" width="476" height="44" rx="8" fill="#edf6ff"/>
  <text x="340" y="718" fill="#174f85" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">1. 복구 대상 Redshift 접속 선택</text>
  <rect x="320" y="746" width="476" height="44" rx="8" fill="#f7f9fb"/>
  <text x="340" y="774" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">2. available 스냅샷 조회 · 선택</text>
  <rect x="320" y="802" width="476" height="44" rx="8" fill="#f7f9fb"/>
  <text x="340" y="830" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">3. 복구 테이블 · 복구방식 입력</text>
  <rect x="320" y="858" width="476" height="56" rx="8" fill="#fff3e8" stroke="#f0d0ad"/>
  <text x="340" y="884" fill="#9d561b" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="700">4. 원본 DROP 복구는 참조 확인 후 실행</text>
  <text x="340" y="905" fill="#9d561b" font-family="Malgun Gothic, Arial, sans-serif" font-size="13">확인 체크 없이는 실행되지 않습니다.</text>
  <rect x="850" y="622" width="566" height="326" rx="12" fill="#ffffff" stroke="#d8e1ec"/>
  <text x="882" y="664" fill="#112d4e" font-family="Malgun Gothic, Arial, sans-serif" font-size="22" font-weight="700">📋 운영 순서</text>
  <circle cx="888" cy="708" r="16" fill="#1769aa"/><text x="883" y="714" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="918" y="714" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">접속정보와 주제영역을 먼저 등록</text>
  <circle cx="888" cy="756" r="16" fill="#1769aa"/><text x="883" y="762" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="918" y="762" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">구조조회 후 테이블·컬럼 매핑 확정</text>
  <circle cx="888" cy="804" r="16" fill="#1769aa"/><text x="883" y="810" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="918" y="810" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">DAG 생성 후 Airflow에 배포·실행</text>
  <circle cx="888" cy="852" r="16" fill="#1769aa"/><text x="883" y="858" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">4</text>
  <text x="918" y="858" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">검증·실행 이력 확인 후 산출물 생성</text>
  <text x="882" y="912" fill="#65788c" font-family="Malgun Gothic, Arial, sans-serif" font-size="13">초기에는 전체 적재, 검증 완료 후 필요한 테이블만 증분 전환합니다.</text>
