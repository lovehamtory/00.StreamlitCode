<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">이관 관리 화면 안내도</title>
  <desc id="desc">이관 관리, 일회성 이관 실행, 스냅샷 복구, 구조조회의 주요 화면 배치를 보여주는 안내도</desc>
  <rect width="1440" height="980" fill="#f6f8fb"/>
  <rect x="24" y="24" width="1392" height="58" rx="10" fill="#0f2747"/>
  <text x="52" y="61" fill="#ffffff" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" font-weight="700">이관 관리 · 화면 안내도</text>
  <text x="1115" y="59" fill="#d8e9ff" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">현재 구현 기준</text>
  <rect x="24" y="100" width="242" height="848" rx="12" fill="#ffffff" stroke="#d8e1ec"/>
  <text x="48" y="140" fill="#183a62" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700">메뉴</text>
  <rect x="42" y="164" width="206" height="40" rx="8" fill="#eaf2fb"/>
  <text x="60" y="190" fill="#174f85" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="700">이관</text>
  <text x="68" y="230" fill="#253649" font-family="Malgun Gothic, Arial, sans-serif" font-size="16">이관 관리</text>
  <text x="68" y="266" fill="#253649" font-family="Malgun Gothic, Arial, sans-serif" font-size="16">일회성 이관 실행</text>
  <rect x="42" y="294" width="206" height="40" rx="8" fill="#f3f6fa"/>
  <text x="60" y="320" fill="#174f85" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="700">운영</text>
  <text x="68" y="360" fill="#253649" font-family="Malgun Gothic, Arial, sans-serif" font-size="16">스냅샷 복구</text>
  <rect x="42" y="388" width="206" height="40" rx="8" fill="#f3f6fa"/>
  <text x="60" y="414" fill="#174f85" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" font-weight="700">구조</text>
  <text x="68" y="454" fill="#253649" font-family="Malgun Gothic, Arial, sans-serif" font-size="16">구조조회</text>
  <line x1="48" y1="500" x2="242" y2="500" stroke="#d8e1ec"/>
  <text x="48" y="536" fill="#5f6f82" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">왼쪽 메뉴에서 큰 업무를 선택합니다.</text>
  <text x="48" y="562" fill="#5f6f82" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">이관 관리 안에서는 상단 업무 버튼으로</text>
  <text x="48" y="586" fill="#5f6f82" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">세부 기능을 전환합니다.</text>
  <rect x="288" y="100" width="1128" height="500" rx="12" fill="#ffffff" stroke="#d8e1ec"/>
  <text x="320" y="145" fill="#112d4e" font-family="Malgun Gothic, Arial, sans-serif" font-size="26" font-weight="700">🧭 이관 관리</text>
  <text x="320" y="174" fill="#67798d" font-family="Malgun Gothic, Arial, sans-serif" font-size="15">하나의 화면에서 설정 · 매핑 · 검증 · 이력 · 산출물을 전환합니다.</text>
