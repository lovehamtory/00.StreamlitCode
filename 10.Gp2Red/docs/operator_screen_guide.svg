  <rect x="824" y="205" width="90" height="40" rx="20" fill="#eef3f8"/>
  <text x="844" y="231" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">산출물</text>
  <rect x="924" y="205" width="100" height="40" rx="20" fill="#eef3f8"/>
  <text x="941" y="231" fill="#35495f" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">접속정보</text>
  <rect x="320" y="274" width="1060" height="70" rx="9" fill="#edf6ff" stroke="#c8ddec"/>
  <text x="344" y="303" fill="#174f85" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="700">주제영역</text>
  <text x="344" y="328" fill="#516579" font-family="Malgun Gothic, Arial, sans-serif" font-size="14">주제영역명 · 상위영역 · 선행영역 · 사용여부를 입력하고 저장합니다.</text>
  <rect x="320" y="366" width="1060" height="184" rx="9" fill="#ffffff" stroke="#d8e1ec"/>
